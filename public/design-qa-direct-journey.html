<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebNest direct journey QA</title>
    <style>
      *{box-sizing:border-box}body{margin:0;padding:24px;color:#f2ede5;background:#050708;font:13px/1.45 system-ui,sans-serif}h1{margin:0 0 18px;font:500 26px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}figure{margin:0;padding:10px;border:1px solid #293031;background:#090d0e}img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}figcaption{padding-top:9px;color:#bdb6ac}strong{color:#e7a069}@media(max-width:900px){.grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <h1>One continuous room → window → building journey</h1>
    <div class="grid">
      <figure><img src="/implementation-direct-journey-start.png" alt="Rendered landing state" /><figcaption><strong>Start:</strong> approved room, live hero content, candle and butterfly.</figcaption></figure>
      <figure><img src="/implementation-direct-journey-window.png" alt="Rendered window-crossing state" /><figcaption><strong>Direct crossing:</strong> hero copy cleared; the same room remains while the butterfly enters its window.</figcaption></figure>
      <figure><img src="/implementation-direct-journey-final.png" alt="Rendered building state" /><figcaption><strong>Arrival:</strong> building replaces that room inside the same sticky section.</figcaption></figure>
    </div>
  </body>
</html>
