<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebNest transition design QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; color: #f5f0e8; background: #050708; font: 14px/1.5 system-ui, sans-serif; }
      h1 { margin: 0 0 22px; font: 500 26px Georgia, serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
      figure { margin: 0; padding: 12px; border: 1px solid #2c3233; background: #090d0e; }
      img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: center; }
      figcaption { padding-top: 10px; color: #c5bdb2; }
      strong { color: #e7a069; }
    </style>
  </head>
  <body>
    <h1>WebNest — exterior visual truth and settled implementation</h1>
    <main>
      <figure>
        <img src="/assets/generated/building-night.png" alt="Generated exterior building visual target" />
        <figcaption><strong>Source visual truth</strong> — cinematic teal-black façade, three warm story windows, quiet left-side negative space.</figcaption>
      </figure>
      <figure>
        <img src="/implementation-second-frame-final.png" alt="Rendered settled WebNest second frame" />
        <figcaption><strong>Rendered implementation</strong> — semantic Growth Problems content, aligned window anchors, butterfly clear of copy.</figcaption>
      </figure>
    </main>
  </body>
</html>
